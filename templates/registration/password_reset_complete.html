{% extends 'base.html' %}

{% block title %}Пароль изменён — DynamicPages{% endblock %}

{% block content %}
<section class="py-5 bg-body-tertiary">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-6">
                <div class="card shadow-sm border-0">
                    <div class="card-body p-4 text-center">
                        <i class="fa-solid fa-check-circle text-success" style="font-size: 4rem;"></i>
                        <h4 class="fw-bold mt-3">Пароль успешно изменён!</h4>
                        <p class="text-muted mb-4">
                            Ваш пароль был успешно изменён. Вы можете войти в систему.
                        </p>
                        <a href="{% url 'login' %}" class="btn btn-primary py-2 px-4">
                            <i class="fa-solid fa-arrow-right-to-home"></i> Войти
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
