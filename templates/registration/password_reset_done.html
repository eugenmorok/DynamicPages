{% extends 'base.html' %}

{% block title %}Ссылка для сброса отправлена — DynamicPages{% endblock %}

{% block content %}
<section class="py-5 bg-body-tertiary">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-6">
                <div class="card shadow-sm border-0">
                    <div class="card-body p-4 text-center">
                        <i class="fa-solid fa-envelope-circle-check text-success" style="font-size: 4rem;"></i>
                        <h4 class="fw-bold mt-3">Проверьте ваш email</h4>
                        <p class="text-muted mb-4">
                            Мы отправили ссылку для сброса пароля на ваш email. Проверьте входящие и папку «Спам».
                        </p>
                        <a href="{% url 'login' %}" class="btn btn-outline-primary">
                            <i class="fa-solid fa-arrow-left"></i> Вернуться ко входу
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
