{% extends 'base.html' %}

{% block title %}Пароль изменён — DynamicPages{% endblock %}

{% block content %}
<section class="py-5 bg-body-tertiary">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-6">
                <div class="card shadow-sm border-0">
                    <div class="card-body p-5 text-center">
                        <i class="fa-solid fa-check-circle text-success" style="font-size: 5rem;"></i>
                        <h1 class="display-1 fw-bold mt-4">OK</h1>
                        <h4 class="fw-bold mb-3">Пароль успешно изменён!</h4>
                        <p class="text-muted mb-4">
                            Ваш пароль был успешно изменён. Вы можете авторизоваться с новым паролем.
                        </p>
                        <div class="d-grid gap-3">
                            <a href="{% url 'login' %}" class="btn btn-primary btn-lg">
                                <i class="fa-solid fa-arrow-right-to-home"></i> Войти
                            </a>
                            <a href="javascript:location.reload()" class="btn btn-outline-secondary btn-lg">
                                <i class="fa-solid fa-arrow-rotate-right"></i> Обновить
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
