{% extends 'base.html' %}

{% block title %}Страница не найдена — {{ site_title|default:'DynamicPages' }}{% endblock %}

{% block content %}
<section class="py-5 bg-body-tertiary">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-6">
                <div class="card shadow-sm border-0">
                    <div class="card-body p-5 text-center">
                        <i class="fa-solid fa-triangle-exclamation text-warning" style="font-size: 5rem;"></i>
                        <h1 class="display-1 fw-bold mt-4">404</h1>
                        <h4 class="fw-bold mb-3">Страница не найдена</h4>
                        <p class="text-muted mb-4">
                            К сожалению, запрошенная страница не существует или была удалена.
                        </p>
                        <div class="d-grid gap-3">
                            <a href="/" class="btn btn-primary btn-lg">
                                <i class="fa-solid fa-house"></i> На главную
                            </a>
                            <a href="/pages/" class="btn btn-outline-secondary btn-lg">
                                <i class="fa-solid fa-list"></i> Все страницы
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
